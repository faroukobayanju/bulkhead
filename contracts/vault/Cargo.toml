[package]
name = "drainme-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
stub-attestation = []
testnet-short-timelock = []

[dependencies]
near-sdk = "5.30.0"
bech32 = "0.11"
sha3 = "0.10"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
overflow-checks = true
panic = "abort"
