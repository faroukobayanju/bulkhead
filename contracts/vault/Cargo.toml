[package]
name = "bulkhead-vault"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/faroukobayanju/bulkhead"

# The mainnet build: `cargo near build reproducible-wasm` in this folder builds inside
# this image, so anyone can rebuild the deployed wasm byte for byte. Rust matches
# rust-toolchain.toml. No features: no stub, 24 h timelock.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
stub-attestation = []
testnet-short-timelock = []

[dependencies]
near-sdk = "5.30.0"
bech32 = "0.11"
sha3 = "0.10"
hex = "0.4"
omni-transaction = { version = "0.5.0", default-features = false, features = ["bitcoin", "evm"] }
shade-attestation = { path = "../shade-attestation" }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
# independent oracles for the tx builders: never linked into the wasm
bitcoin = "0.32"
alloy-consensus = "2.5"
alloy-primitives = "1.7"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
overflow-checks = true
panic = "abort"
